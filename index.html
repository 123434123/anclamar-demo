<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>منصة الطلب المباشر للمطاعم | تجربة طلب ذكية وسريعة</title>
  <meta name="description" content="منصة طلب طعام ذكية عبر واتساب مباشرة، تصفح القائمة مع التخصيص الكامل للخيارات واطلب فوريًا بدون عمولات.">
  <meta property="og:type" content="restaurant.restaurant">
  <meta property="og:title" content="منصة الطلب المباشر للمطاعم">
  <meta property="og:description" content="تصفح القائمة واطلب وجبتك المفضلة مباشرة عبر واتساب بدون عمولات.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- 1. HEADER (Hydrated dynamically) -->
  <header class="site-header" id="headerMount"></header>

  <!-- 2. MAIN CONTENT -->
  <main id="top">
    <!-- Hero Section -->
    <section class="hero-section" id="heroMount"></section>

    <!-- Search & Sticky Category Tabs -->
    <div class="menu-controls-wrapper">
      <div class="search-box-wrap">
        <input type="search" id="menuSearchInput" class="menu-search-input" placeholder="🔍 ابحث في الأصناف والمأكولات..." aria-label="Search menu">
      </div>
      <div class="category-tabs-sticky" id="categoryTabs" role="tablist"></div>
    </div>

    <!-- Menu Grid -->
    <section id="menu" class="menu-section">
      <div id="menuContainer"></div>
    </section>

    <!-- Reviews Section -->
    <section id="reviews">
      <div id="reviewsMount"></div>
    </section>

    <!-- Location & Contact Section -->
    <section id="contact">
      <div id="contactMount"></div>
    </section>
  </main>

  <!-- 3. FOOTER -->
  <footer class="site-footer" id="footerMount"></footer>

  <!-- 4. MODIFIERS MODAL (Item Customization) -->
  <div class="modal-overlay" id="modifierModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-dialog" id="modifierModalBody">
      <!-- Injected dynamically by window.App.openModifierModal() -->
    </div>
  </div>

  <!-- 5. STICKY BOTTOM CART PILL BAR -->
  <div class="cart-pill-bar" id="cartPillBar" onclick="window.App.openCartDrawer()">
    <div class="cart-pill-info">
      <span>🛒</span>
      <b id="cartPillCount">0 أصناف</b>
    </div>
    <div class="cart-pill-cta">
      <span id="cartPillCtaText">عرض الطلب</span>
      <span id="cartPillTotal">0 جنيه</span>
      <span class="cart-pill-arrow">←</span>
    </div>
  </div>

  <!-- 6. CART & CHECKOUT DRAWER -->
  <div class="cart-drawer-overlay" id="cartDrawer" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="cart-drawer">
      <div class="cart-drawer-header">
        <h3 id="cartDrawerTitle">سلة الطلبات 🛍️</h3>
        <button class="cart-drawer-close" onclick="window.App.closeCartDrawer()" aria-label="إغلاق">&times;</button>
      </div>

      <div class="cart-drawer-body">
        <!-- Order Type Segmented Switch -->
        <div class="order-type-switch">
          <button class="order-type-btn active" id="typeDeliveryBtn" onclick="window.App.setOrderType('delivery')">🛵 توصيل للمنزل</button>
          <button class="order-type-btn" id="typeTakeawayBtn" onclick="window.App.setOrderType('takeaway')">🛍️ استلام من الفرع</button>
        </div>

        <!-- Cart Items List -->
        <div class="cart-drawer-items" id="cartDrawerItemsList"></div>

        <!-- Customer & Delivery Fields -->
        <div class="checkout-fields">
          <div class="field-group">
            <label for="custName" id="labelCustName">الاسم بالكامل *</label>
            <input type="text" id="custName" placeholder="اكتب اسمك هنا" autocomplete="name" required>
          </div>

          <div class="field-group">
            <label for="custPhone" id="labelCustPhone">رقم الهاتف للتواصل *</label>
            <input type="tel" id="custPhone" placeholder="01XXXXXXXXX" autocomplete="tel" required>
          </div>

          <div class="field-group" id="checkoutAddressWrap">
            <label for="custAddress" id="labelCustAddress">عنوان التوصيل بالتفصيل *</label>
            <input type="text" id="custAddress" placeholder="المنطقة، الشارع، رقم العمارة، الدور، الشقة" autocomplete="street-address">
          </div>

          <div class="field-group">
            <label for="custNotes" id="labelCustNotes">ملاحظات إضافية على الطلب</label>
            <textarea id="custNotes" rows="2" placeholder="أي تفاصيل خاصة بالتتبيلة أو طريقة الاستلام"></textarea>
          </div>
        </div>

        <!-- Totals Summary -->
        <div class="cart-summary">
          <div class="summary-row">
            <span id="labelSubtotal">المجموع الفرعي:</span>
            <b id="drawerSubtotal">0 جنيه</b>
          </div>
          <div class="summary-row" id="drawerDeliveryFeeRow">
            <span id="labelDeliveryFee">رسوم التوصيل:</span>
            <b id="drawerDeliveryFee">25 جنيه</b>
          </div>
          <div class="summary-row grand-total">
            <span id="labelGrandTotal">الإجمالي النهائي:</span>
            <b id="drawerGrandTotal">0 جنيه</b>
          </div>
        </div>
      </div>

      <div class="cart-drawer-footer">
        <button class="whatsapp-submit-btn" onclick="window.App.sendWhatsAppOrder()">
          <span id="whatsappSubmitBtnText">إرسال الطلب عبر واتساب 💬</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 7. SECRET PITCH TOOLBAR -->
  <div class="pitch-toolbar" id="pitchToolbar" aria-hidden="true"></div>

  <!-- 8. MODULAR APPLICATION SCRIPTS -->
  <script src="data/presets.js"></script>
  <script src="js/pitch-controls.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.App && window.App.init) {
        window.App.init();
      }
    });
  </script>
</body>
</html>
